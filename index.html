<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тест — Деньги и Банки</title>
<style>
:root{--bg:#f2f4ef;--card:#fff;--ink:#14302b;--mute:#5d6f6a;--line:#d5dcd6;--acc:#14594d;--acc-ink:#fff;--ok:#1d7a46;--okbg:#e3f3e9;--bad:#b3322b;--badbg:#f9e4e2;--sel:#e6efe9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a17;--card:#182622;--ink:#e6efe9;--mute:#9bb0a9;--line:#2c403a;--acc:#4fb39f;--acc-ink:#08201b;--ok:#6fd49a;--okbg:#17352a;--bad:#ff8d85;--badbg:#3a1d1b;--sel:#213630;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a17;--card:#182622;--ink:#e6efe9;--mute:#9bb0a9;--line:#2c403a;--acc:#4fb39f;--acc-ink:#08201b;--ok:#6fd49a;--okbg:#17352a;--bad:#ff8d85;--badbg:#3a1d1b;--sel:#213630;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 16px;letter-spacing:-.01em}
h2{font-size:1.15rem;margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
button,input,textarea,select{font:inherit;color:var(--ink)}
button{cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);padding:10px 16px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
button.danger{color:var(--bad)}
button:disabled{opacity:.4;cursor:not-allowed}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin:6px 0 12px}
textarea{min-height:240px;font:14px/1.5 ui-monospace,Menlo,monospace}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.hint{color:var(--mute);font-size:.9rem;font-family:system-ui,sans-serif}
.warn{background:var(--badbg);border-radius:8px;padding:10px 12px;font:.9rem system-ui,sans-serif;margin-bottom:14px}
.top{display:flex;justify-content:space-between;margin-bottom:10px;color:var(--mute);font-family:system-ui,sans-serif}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.timer.low{color:var(--bad)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.q{font-size:1.2rem;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;margin-bottom:10px}
.opt.sel{background:var(--sel);border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.nav{display:flex;justify-content:space-between;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats div{background:var(--sel);border-radius:8px;padding:12px 6px}
.stats b{display:block;font:700 1.5rem system-ui,sans-serif}
.stats span{color:var(--mute);font:.85rem system-ui,sans-serif}
.verdict{margin-top:14px;padding:12px;border-radius:8px;font:700 1.05rem system-ui,sans-serif;text-align:center}
.verdict.ok{background:var(--okbg);color:var(--ok)}.verdict.bad{background:var(--badbg);color:var(--bad)}
.item{border-left:4px solid var(--line);padding:8px 12px;margin-bottom:10px;border-radius:0 8px 8px 0}
.item.ok{border-color:var(--ok);background:var(--okbg)}.item.bad{border-color:var(--bad);background:var(--badbg)}
.item p{margin:0 0 4px}.item small{display:block;font-family:system-ui,sans-serif;color:var(--mute)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font:.9rem system-ui,sans-serif;min-width:620px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
td.ok{color:var(--ok);font-weight:700}td.bad{color:var(--bad);font-weight:700}
.list button{display:block;width:100%;text-align:left;margin-bottom:8px}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== НАСТРОЙКИ (заполните по инструкции из README) =====
const FIREBASE_CONFIG={apiKey:'ВСТАВЬТЕ',authDomain:'',projectId:'',appId:''};
const ADMIN_EMAIL='admin@example.com'; // e-mail админа, созданный в Firebase Authentication
const ADMIN_PIN='1234';                // только для локального режима без Firebase
const MAX_MISTAKES=3, QCOUNT=25, LIMIT=30*60;
const DEFAULT={id:'default',title:'Тест из questions.txt',builtin:true,questions:[]};

const $=id=>document.getElementById(id);
const h=(t,p,...k)=>{const e=document.createElement(t);for(const x in (p||{})){if(x==='class')e.className=p[x];else if(x.startsWith('on'))e[x]=p[x];else if(x==='value')e.value=p[x];else e.setAttribute(x,p[x])}k.flat().forEach(c=>{if(c!=null)e.append(c)});return e};
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const uid=()=>'t'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);

// ---------- хранилище: Firebase Firestore или localStorage ----------
let fb=null,auth=null,admin=false,unsubRes=null;
const cache={tests:[],results:[]};
const LS=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}};
const LSset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
cache.tests=LS('tests');cache.results=LS('results');
async function save(col,id,data){
  if(fb){if(col==='results')await fb.collection('results').add(data);else await fb.collection(col).doc(id).set(data);return}
  const a=cache[col].filter(x=>x.id!==id);a.push({id,...data});cache[col]=a;LSset(col,a);route();
}
async function remove(col,id){
  if(fb){await fb.collection(col).doc(id).delete();return}
  cache[col]=cache[col].filter(x=>x.id!==id);LSset(col,cache[col]);route();
}
function watchResults(){
  if(!fb||unsubRes)return;
  unsubRes=fb.collection('results').onSnapshot(s=>{cache.results=s.docs.map(d=>({id:d.id,...d.data()}));route()},()=>{unsubRes=null});
}
function initDb(){
  if(!window.firebase||!FIREBASE_CONFIG.apiKey||FIREBASE_CONFIG.apiKey.startsWith('ВСТАВЬТЕ'))return;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);fb=firebase.firestore();auth=firebase.auth();
    cache.tests=[];cache.results=[];
    fb.collection('tests').onSnapshot(s=>{cache.tests=s.docs.map(d=>({id:d.id,...d.data()}));route()},()=>{});
    auth.onAuthStateChanged(u=>{admin=!!u&&u.email===ADMIN_EMAIL;if(admin)watchResults()});
  }catch(e){fb=null}
}
const allTests=()=>[...(DEFAULT.questions.length?[DEFAULT]:[]),...cache.tests];
const findTest=id=>allTests().find(t=>t.id===id);

// ---------- маршруты ----------
let quiz=null,timer=null;
function route(){
  if(quiz&&quiz.active)return;
  const hash=location.hash.slice(1);
  if(hash==='admin'&&admin)return viewAdmin();
  if(hash.startsWith('test-')){const t=findTest(hash.slice(5));if(t)return viewStart(t)}
  viewHome();
}
window.addEventListener('hashchange',()=>{if(quiz&&quiz.active)return;route()});
const mount=(...n)=>{const a=$('app');a.replaceChildren(...n.flat().filter(Boolean));window.scrollTo(0,0)};
const modeNote=()=>fb?null:h('div',{class:'warn'},'Firebase не подключён: тесты и результаты сохраняются только на этом устройстве. Подключите Firebase (см. README), чтобы админ видел результаты всех студентов.');

async function enterAdmin(){
  if(!fb){if(prompt('PIN администратора')!==ADMIN_PIN)return;admin=true;location.hash='admin';return route()}
  if(admin){location.hash='admin';return route()}
  viewLogin();
}
function viewLogin(){
  const em=h('input',{type:'email',placeholder:'E-mail админа',autocomplete:'username'}),pw=h('input',{type:'password',placeholder:'Пароль',autocomplete:'current-password'}),msg=h('p',{class:'hint'});
  mount(h('h1',{},'Вход для админа'),h('div',{class:'card'},em,pw,msg,h('div',{class:'row'},
    h('button',{class:'primary',onclick:async()=>{
      try{const c=await auth.signInWithEmailAndPassword(em.value.trim(),pw.value);
        if(c.user.email!==ADMIN_EMAIL){await auth.signOut();throw new Error('Это не админ-аккаунт')}
        admin=true;watchResults();location.hash='admin';route()}
      catch(e){msg.textContent='Не удалось войти: '+(e.message||e.code);msg.style.color='var(--bad)'}}},'Войти'),
    h('button',{onclick:()=>{location.hash='';route()}},'Отмена'))));
}

// ---------- главная ----------
function viewHome(){
  mount(h('h1',{},'Тесты'),modeNote(),
    allTests().length?null:h('p',{class:'hint'},'Тестов пока нет. Войдите в админ-профиль и создайте первую страницу с вопросами.'),h('div',{class:'list'},allTests().map(t=>h('button',{onclick:()=>{location.hash='test-'+t.id}},t.title+' · вопросов в базе: '+t.questions.length))),
    h('p',{},h('button',{class:'primary',onclick:enterAdmin},'Админ-профиль')));
}

// ---------- старт теста ----------
function viewStart(t){
  const inp=h('input',{placeholder:'Фамилия и имя',maxlength:'60',value:localStorage.getItem('sname')||''});
  const n=Math.min(QCOUNT,t.questions.length);
  mount(h('h1',{},t.title),modeNote(),h('div',{class:'card'},
    h('label',{},'Ваше имя',inp),
    h('p',{class:'hint'},n+' вопросов · 30 минут · тест не сдан, если ошибок больше '+MAX_MISTAKES+'.'),
    h('button',{class:'primary',onclick:()=>{const nm=inp.value.trim();if(!nm){inp.focus();return}try{localStorage.setItem('sname',nm)}catch(e){}startQuiz(t,nm)}},'Начать тест')),
    h('button',{onclick:()=>{location.hash=''}},'Назад'));
}

function startQuiz(t,name){
  const qs=shuffle(t.questions).slice(0,QCOUNT).map(q=>({q:q.q,opts:shuffle(q.o.map((x,i)=>({t:x,ok:i===q.a})))}));
  quiz={active:true,t,name,qs,ans:new Array(qs.length).fill(-1),i:0,left:LIMIT};
  clearInterval(timer);
  timer=setInterval(()=>{quiz.left--;const e=$('timer');if(e){e.textContent=fmt(quiz.left);e.classList.toggle('low',quiz.left<=60)}if(quiz.left<=0)finish()},1000);
  renderQ();
}
function renderQ(){
  const{qs,i,ans}=quiz,q=qs[i];
  mount(h('div',{class:'card'},
    h('div',{class:'top'},h('span',{},'Вопрос '+(i+1)+' из '+qs.length),h('span',{class:'timer',id:'timer'},fmt(quiz.left))),
    h('div',{class:'bar'},h('i',{style:'width:'+((i+1)/qs.length*100)+'%'})),
    h('p',{class:'q'},q.q),
    q.opts.map((o,k)=>h('button',{class:'opt'+(ans[i]===k?' sel':''),onclick:()=>{ans[i]=k;renderQ()}},o.t)),
    h('div',{class:'nav'},
      h('button',{onclick:()=>{if(quiz.i>0){quiz.i--;renderQ()}}},'Назад'),
      h('button',{class:'primary',onclick:()=>{i<qs.length-1?(quiz.i++,renderQ()):finish()}},i===qs.length-1?'Завершить':'Следующий'))));
  document.querySelector('.nav button').disabled=i===0;
}

// ---------- результат ----------
async function finish(){
  if(!quiz||!quiz.active)return;
  clearInterval(timer);quiz.active=false;
  const{qs,ans,t,name}=quiz,spent=LIMIT-Math.max(quiz.left,0);
  let ok=0,answered=0;const good=[],bad=[];
  qs.forEach((q,n)=>{
    const right=q.opts.find(o=>o.ok).t,has=ans[n]>=0,mine=has?q.opts[ans[n]].t:'нет ответа',g=has&&q.opts[ans[n]].ok;
    if(has)answered++;if(g)ok++;
    (g?good:bad).push(h('div',{class:'item '+(g?'ok':'bad')},h('p',{},(n+1)+'. '+q.q),h('small',{},g?'Ваш ответ: '+mine:'Ваш ответ: '+mine+' · Правильно: '+right)));
  });
  const wrong=qs.length-ok,pct=Math.round(ok/qs.length*100),passed=wrong<=MAX_MISTAKES;
  const rec={testId:t.id,testTitle:t.title,name,total:qs.length,answered,ok,bad:wrong,pct,passed,time:spent,ts:Date.now()};
  const status=h('p',{class:'hint'},'Сохраняю результат…');
  mount(h('div',{class:'card'},h('h2',{style:'margin-top:0'},'Результат теста'),
    h('div',{class:'stats'},h('div',{},h('b',{},ok+'/'+qs.length),h('span',{},'Результат')),h('div',{},h('b',{},pct+'%'),h('span',{},'Процент')),h('div',{},h('b',{},fmt(spent)),h('span',{},'Время'))),
    h('p',{},'Правильных ответов: '+ok+' · Неправильных ответов: '+wrong),
    h('div',{class:'verdict '+(passed?'ok':'bad')},passed?'Тест сдан':'Тест провален: ошибок больше '+MAX_MISTAKES),status),
    h('h2',{},'Правильные ответы'),good,h('h2',{},'Неправильные ответы'),bad,
    h('button',{class:'primary',onclick:()=>{quiz=null;location.hash='test-'+t.id;route()}},'Пройти заново'),' ',
    h('button',{onclick:()=>{quiz=null;location.hash='';route()}},'На главную'));
  try{await save('results',uid(),rec);status.textContent='Результат сохранён.'}
  catch(e){status.textContent='Не удалось сохранить результат: у вас нет права записи. Попросите администратора выдать доступ.'}
}

// ---------- админ ----------
const toText=t=>t.questions.map(q=>[q.q,...q.o,q.a+1].join(' | ')).join('\n');
function parseQs(txt){
  const out=[];
  for(const [n,line] of txt.split('\n').map((l,i)=>[i+1,l.trim()]).filter(x=>x[1])){
    const p=line.split('|').map(s=>s.trim()),a=parseInt(p[p.length-1],10),o=p.slice(1,-1);
    if(p.length<4||o.some(x=>!x)||!(a>=1&&a<=o.length))throw new Error('Строка '+n+': формат «Вопрос | вариант | вариант | … | номер правильного»');
    out.push({q:p[0],o,a:a-1});
  }
  if(!out.length)throw new Error('Добавьте хотя бы один вопрос');
  return out;
}
function viewAdmin(){
  const sel=h('select',{},h('option',{value:''},'Все тесты'),allTests().map(t=>h('option',{value:t.id},t.title)));
  const tbl=h('div',{class:'scroll'});
  const draw=()=>{
    const rows=cache.results.filter(r=>!sel.value||r.testId===sel.value).sort((a,b)=>b.ts-a.ts);
    tbl.replaceChildren(rows.length?h('table',{},h('tr',{},['Студент','Тест','Решено','Верно','Ошибок','Процент','Итог','Время','Дата'].map(x=>h('th',{},x))),
      rows.map(r=>h('tr',{},h('td',{},r.name),h('td',{},r.testTitle),h('td',{},r.answered+'/'+r.total),h('td',{},String(r.ok)),h('td',{},String(r.bad)),h('td',{},r.pct+'%'),
        h('td',{class:r.passed?'ok':'bad'},r.passed?'Сдан':'Провал'),h('td',{},fmt(r.time)),h('td',{},new Date(r.ts).toLocaleString('ru-RU')))))
      :h('p',{class:'hint'},'Результатов пока нет.'));
  };
  sel.onchange=draw;draw();
  const exportBtn=h('button',{onclick:()=>{const rows=cache.results.sort((a,b)=>b.ts-a.ts).map(r=>[r.name,r.testTitle,r.answered,r.ok,r.bad,r.pct,r.passed?'сдан':'провал',fmt(r.time),new Date(r.ts).toLocaleString('ru-RU')].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','));
    const url=URL.createObjectURL(new Blob(['\ufeffСтудент,Тест,Решено,Верно,Ошибок,Процент,Итог,Время,Дата\n'+rows.join('\n')],{type:'text/csv'}));
    const a=h('a',{href:url,download:'results.csv'});document.body.append(a);a.click();a.remove()}},'Скачать CSV');
  mount(h('div',{class:'row sp'},h('h1',{},'Админ-профиль'),h('button',{onclick:()=>{admin=false;if(auth)auth.signOut();if(unsubRes){unsubRes();unsubRes=null}cache.results=fb?[]:cache.results;location.hash='';route()}},'Выйти')),modeNote(),
    h('h2',{},'Результаты студентов'),h('div',{class:'row'},sel,exportBtn),tbl,
    h('h2',{},'Страницы с вопросами'),allTests().length?null:h('p',{class:'hint'},'Пока нет ни одной страницы. Создайте первую.'),
    h('p',{},h('button',{class:'primary',onclick:()=>viewEdit({id:uid(),title:'Новый тест',questions:[]})},'Создать страницу с вопросами')),
    allTests().map(t=>h('div',{class:'card'},h('div',{class:'row sp'},h('b',{},t.title),h('span',{class:'hint'},t.questions.length+' вопросов')),
      h('p',{class:'hint'},'Ссылка: '+location.href.split('#')[0]+'#test-'+t.id),
      h('div',{class:'row'},
        t.builtin?null:h('button',{onclick:()=>viewEdit(t)},'Изменить'),
        h('button',{onclick:()=>viewEdit({id:uid(),title:t.title+' (копия)',questions:t.questions})},'Копировать'),
        t.builtin?null:h('button',{class:'danger',onclick:async()=>{if(confirm('Удалить тест «'+t.title+'»?'))await remove('tests',t.id)}},'Удалить')))));
}
function viewEdit(t){
  const title=h('input',{value:t.title,maxlength:'120'}),ta=h('textarea',{},toText(t)),msg=h('p',{class:'hint'});
  mount(h('h1',{},'Редактор теста'),h('div',{class:'card'},
    h('label',{},'Название страницы',title),
    h('label',{},'Вопросы: по одному в строке',ta),
    h('p',{class:'hint'},'Формат: Вопрос | вариант 1 | вариант 2 | вариант 3 | вариант 4 | номер правильного (1–4). Студентам случайно выпадает '+QCOUNT+' вопросов из этого списка.'),msg,
    h('div',{class:'row'},
      h('button',{class:'primary',onclick:async()=>{
        try{const qs=parseQs(ta.value),ti=title.value.trim()||'Без названия';
          await save('tests',t.id,{title:ti,questions:qs});location.hash='admin';route()}
        catch(e){msg.textContent=e.message;msg.style.color='var(--bad)'}}},'Сохранить'),
      h('button',{onclick:()=>{location.hash='admin';route()}},'Отмена'))));
}

// ---------- чтение questions.txt из репозитория ----------
function parseAny(txt){
  txt=txt.replace(/^\uFEFF/,'').replace(/\r/g,'');
  if(txt.includes('|')){try{return parseQs(txt)}catch(e){}}
  const out=[],lat='abcd',cyr='абвг';
  for(const blk of txt.split(/\n\s*\n/)){
    const L=blk.split('\n').map(x=>x.trim()).filter(Boolean);
    if(L.length<3)continue;
    const q=L[0].replace(/^\d+[.)]\s*/,''),o=[];let a=-1,key=null;
    for(const l of L.slice(1)){
      const m=l.match(/^(?:ответ|answer|правильный ответ)\s*[:\-]\s*(.+)$/i);
      if(m){key=m[1].trim();continue}
      let t=l,mark=false;
      if(/^[*+=✓✔]\s*/.test(t)){mark=true;t=t.replace(/^[*+=✓✔]\s*/,'')}
      if(/\s*[*✓✔]$/.test(t)){mark=true;t=t.replace(/\s*[*✓✔]$/,'')}
      t=t.replace(/^[A-Da-dА-Га-г][.)]\s+/,'');
      o.push(t);if(mark)a=o.length-1;
    }
    if(a<0&&key){const c=key[0].toLowerCase();a=lat.indexOf(c);if(a<0)a=cyr.indexOf(c);if(a<0)a=parseInt(key,10)-1}
    if(o.length>=2&&a>=0&&a<o.length)out.push({q,o,a});
  }
  return out;
}
fetch('questions.txt',{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{
  const qs=parseAny(t);if(qs.length){DEFAULT.questions=qs;route()}
}).catch(()=>{});

route();
initDb();
</script>
</body>
</html>
